<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="nav_brand">在地導覽平台</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/i18n.js"></script>
</head>
<body>

    <nav>
        <div class="nav-brand" onclick="app.showHome()" data-i18n="nav_brand">在地導覽平台</div>
        <div class="nav-user">
            <select id="lang-selector" onchange="app.changeLanguage(this.value)">
                <option value="zh-TW">繁體中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
            </select>
            <select id="user-role" onchange="app.switchUser(this.value)">
                <option value="guest">訪客</option>
                <option value="traveler_john">遊客 John</option>
                <option value="cafe_owner">咖啡館主</option>
                <option value="store_owner">文創店主</option>
            </select>
        </div>
    </nav>

    <div id="view-home" class="view active">
        <div class="hero" id="hero-main" onclick="app.jumpToMerchant()">
            <div id="hero-track" class="hero-track"></div>
            <div class="hero-content">
                <p data-i18n="hero_badge" style="background: var(--retro-red); margin-bottom: 1rem;">✨ 嚴選在地故事</p>
                <h1 id="hero-title"></h1>
                <p id="hero-subtitle"></p>
            </div>
        </div>
        
        <div style="margin-top: 4rem;">
            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; margin-left: 3rem; margin-right: 3rem;">
                <h2 style="font-size: 2rem; font-weight: 800; color: var(--forest-green);">📍 探索導覽地圖</h2>
                <p style="color: var(--text-muted);">發掘您周邊的文化亮點與職人故事</p>
            </div>
            <div class="grid-layout">
                <div class="sidebar">
                    <div style="position: sticky; top: 120px;">
                        <input type="text" id="search-input" class="search-box" placeholder="搜尋店名、類別或標籤..." onkeyup="app.filterMerchants()">
                        <button class="btn btn-primary" id="btn-add-merchant" style="display:none; width:100%; margin-bottom:1.5rem; justify-content: center;" onclick="app.openAddModal()">✨ 註冊新店家</button>
                        <ul class="merchant-list" id="merchant-list"></ul>
                    </div>
                </div>
                <div class="map-container">
                    <iframe id="map-iframe" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d115681!2d121.463!3d25.033!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442a9727e339109%3A0xc34a31ce3a4abecb!2z5Y-w5YyX5biC!5e0!3m2!1szh-TW!2stw!4v1714000000000!5m2!1szh-TW!2stw" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>
        </div>
    </div>

    <div id="view-detail" class="view">
        <button class="btn btn-primary" onclick="app.showHome()" style="background: white; color: var(--forest-green); border: 1px solid #e2e8f0; box-shadow: var(--shadow-sm);">← 返回列表</button>
        <div id="detail-content" style="margin-top: 2rem;"></div>
    </div>

    <div class="modal-overlay" id="add-overlay" onclick="app.closeAddModal()"></div>
    <div class="ai-modal" id="add-modal">
        <h2>註冊新店家</h2>
        <div style="margin-top:1rem;">
            <p>店名：<input type="text" id="add-name" class="search-box"></p>
            <p>類別：<input type="text" id="add-category" class="search-box"></p>
            <p>地址：<input type="text" id="add-address" class="search-box"></p>
            <p>營業：<input type="text" id="add-hours" class="search-box"></p>
            <button class="btn btn-primary" onclick="app.submitNewMerchant()" style="width:100%; justify-content: center;">✨ 確認註冊</button>
        </div>
    </div>

    <div class="modal-overlay" id="edit-overlay" onclick="app.closeEditModal()"></div>
    <div class="ai-modal" id="edit-modal">
        <h2>編輯店家</h2>
        <div style="margin-top:1rem;">
            <p>店名：<input type="text" id="edit-name" class="search-box"></p>
            <p>地址：<input type="text" id="edit-address" class="search-box"></p>
            <p>營業：<input type="text" id="edit-hours" class="search-box"></p>
            <p>公告：<input type="text" id="edit-announcement" class="search-box"></p>
            <p>描述：<textarea id="edit-description" class="search-box" style="height:100px;"></textarea></p>
            <button class="btn btn-edit" onclick="app.submitEditMerchant()" style="width:100%; justify-content: center;">💾 儲存變更</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
